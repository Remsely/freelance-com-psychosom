# Enable parallel project execution - allows Gradle to run independent projects simultaneously
# Source: https://docs.gradle.org/current/userguide/performance.html#sec:enable_parallel_execution
org.gradle.parallel=true
# Enable build caching - stores task outputs and reuses them when inputs haven't changed
# Source: https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enable configuration cache - caches the task graph between builds
# Source: https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable incremental compilation for Kotlin - only recompiles changed files and their dependencies
# Source: https://kotlinlang.org/docs/gradle-compilation-and-caches.html#incremental-compilation
kotlin.incremental=true
# Enable Kotlin compilation caching - caches compilation artifacts between builds
# Source: https://kotlinlang.org/docs/gradle-compilation-and-caches.html#gradle-build-cache-support
kotlin.caching.enabled=true
